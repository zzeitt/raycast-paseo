name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # vitest and tsc say nothing about package.json, which is the extension's manifest here: a
      # preference with a type Raycast does not know, or a command with no matching entry point, only
      # surfaces when the manifest is validated. `ray` is a local bin, so this needs no setup.
      - name: Check the extension manifest
        run: npm run build
